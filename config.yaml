audio:
  sample_rate: 16000
  channels: 1
  chunk_seconds: 20
  silence_threshold: 0.01

model:
  name: v3_e2e_rnnt
  device: auto  # auto | cuda | cpu

paths:
  temp_dir: temp_chunks
  output_dir: output

preprocess:
  enabled: true  # Создавать ли очищенный для RAG транскрипт (<stem>_rag_clean.txt)

summarize:
  enabled: false  # Установите true, если нужно включить генерацию конспекта
  provider: gemini
  model_name: gemini-3.5-flash-lite
  prompt: |
    Ты — профессиональный академический ассистент. Составь подробный и структурированный конспект лекции по предоставленному ниже транскрипту.
    Обязательно:
    1. Выдели главные темы и разделы.
    2. Сохрани ключевые таймкоды в формате [ЧЧ:ММ:СС] для основных блоков и тезисов.
    3. Сделай выжимку главных мыслей, терминов и выводов.
    ---
    {transcript}